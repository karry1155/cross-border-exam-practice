<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>电子商务师五级实操互动练习</title>
  <style>
    :root {
      --ink:#172033; --muted:#64748b; --line:#d7e0ea; --paper:#f6f8fb;
      --panel:#fff; --brand:#1f4e78; --accent:#d49a38;
      --good:#147a43; --good-bg:#e7f7ee; --bad:#b42318; --bad-bg:#fff0ee;
    }
    * { box-sizing: border-box; }
    body {
      margin:0; background:var(--paper); color:var(--ink);
      font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;
    }
    header { position:sticky; top:0; z-index:5; background:#ffffffee; border-bottom:1px solid var(--line); backdrop-filter:blur(10px); }
    .topbar { max-width:1240px; margin:auto; padding:18px 24px 12px; display:grid; grid-template-columns:1fr auto; gap:16px; align-items:center; }
    h1 { margin:0; color:var(--brand); font-size:24px; }
    .score { border:1px solid var(--line); border-radius:8px; padding:9px 13px; background:#fff; color:var(--muted); font-weight:700; }
    .score strong { color:var(--brand); font-size:20px; }
    nav { max-width:1240px; margin:auto; padding:0 24px 14px; display:flex; gap:8px; overflow-x:auto; }
    nav button { flex:0 0 auto; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--brand); padding:7px 10px; font-size:13px; font-weight:700; cursor:pointer; }
    nav button.active { border-color:var(--brand); background:#e8f1f9; }
    nav button.done { border-color:var(--good); color:var(--good); }
    main { max-width:1240px; margin:auto; padding:24px; }
    section { margin:0 0 28px; padding:22px; background:var(--panel); border:1px solid var(--line); border-radius:8px; }
    h2 { margin:0 0 16px; color:var(--brand); font-size:20px; border-left:5px solid var(--accent); padding-left:10px; }
    h3 { margin:0 0 8px; font-size:17px; color:#21344f; }
    .pager { display:flex; justify-content:space-between; gap:10px; align-items:center; margin:0 0 12px; color:var(--muted); font-weight:800; }
    .pager button { border:1px solid #bdc9d8; background:white; border-radius:8px; padding:8px 12px; color:var(--brand); font:inherit; font-weight:800; cursor:pointer; }
    .pager button:disabled { color:#94a3b8; cursor:not-allowed; background:#f1f5f9; }
    .material { margin:0 0 18px; padding:12px; border:1px solid #d7e0ea; border-radius:8px; background:#f3f6fa; color:#334155; }
    .material-title { margin:0 0 8px; color:#294564; font-weight:900; }
    .exam-meta { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 16px; }
    .exam-meta span { display:inline-flex; align-items:center; min-height:28px; border:1px solid #c8d5e4; border-radius:6px; background:#f8fbff; color:#294564; padding:4px 8px; font-size:13px; font-weight:800; }
    .exam-meta .focus { border-color:#e5bd72; background:#fff8e8; color:#7a4a0b; }
    .source { margin:0 0 18px; padding:12px; border:1px solid #dbe6f1; border-radius:8px; background:#fbfdff; }
    .source h4 { margin:0 0 8px; color:#294564; font-size:14px; }
    .source ul { margin:6px 0 6px 18px; padding:0; }
    .source li { margin:2px 0; }
    .mini-table { width:100%; border-collapse:collapse; margin:8px 0; font-size:13px; }
    .mini-table th, .mini-table td { border:1px solid var(--line); padding:6px 7px; vertical-align:top; }
    .mini-table th { background:#e8f1f9; color:#183a5a; text-align:left; }
    .question { border-top:1px solid var(--line); padding:18px 0 3px; }
    .question:first-of-type { border-top:0; }
    .stem { color:var(--muted); margin:0 0 10px; }
    .fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .field { border:1px solid var(--line); background:#fbfdff; border-radius:8px; padding:10px; }
    .field-note { margin:0 0 8px; padding:8px 10px; border-radius:6px; background:#eef2f7; color:#475569; font-size:13px; }
    .stock-table { width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; }
    .stock-table th, .stock-table td { border:1px solid var(--line); padding:8px; vertical-align:top; }
    .stock-table th { background:#e8f1f9; color:#183a5a; text-align:left; }
    .stock-table select { min-width:105px; }
    .excel-toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 10px; }
    .excel-status { color:var(--muted); font-weight:800; }
    .excel-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:8px; background:#fff; }
    .excel-table { width:100%; min-width:1100px; border-collapse:collapse; font-size:13px; }
    .excel-table th, .excel-table td { border:1px solid #d6deea; padding:7px 8px; vertical-align:middle; white-space:nowrap; }
    .excel-table th { background:#e8f1f9; color:#183a5a; text-align:left; }
    .excel-table th.row-head, .excel-table td.row-head { width:64px; text-align:center; background:#f8fafc; color:#64748b; font-weight:800; }
    .excel-table td.deleted { color:#94a3b8; text-decoration:line-through; background:#f8fafc; }
    .excel-table .delete-row { min-width:34px; border:1px solid #cbd5e1; border-radius:6px; background:#fff; color:#b42318; font-weight:900; cursor:pointer; }
    .excel-table .delete-row:disabled { color:#94a3b8; cursor:not-allowed; background:#f1f5f9; }
    .excel-table .header-control { display:flex; align-items:center; gap:6px; }
    .excel-table .header-control select { min-width:96px; min-height:30px; padding:3px 6px; }
    .excel-table .sort-btn { border:1px solid #bdc9d8; border-radius:6px; background:#fff; color:var(--brand); font-weight:900; cursor:pointer; padding:4px 7px; }
    .excel-table .sort-btn.active { border-color:var(--good); background:var(--good-bg); color:var(--good); }
    label { display:block; margin:0 0 6px; font-weight:800; color:#24364f; }
    select { width:100%; min-height:38px; padding:7px 9px; border:1px solid #bdc9d8; border-radius:6px; background:white; color:var(--ink); font:inherit; }
    select.correct { border-color:var(--good); background:var(--good-bg); color:var(--good); }
    select.wrong { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
    .chips { display:flex; flex-wrap:wrap; gap:8px; }
    button.choice, button.ghost { border:1px solid #bdc9d8; background:white; border-radius:8px; padding:8px 10px; color:var(--ink); font:inherit; cursor:pointer; text-align:left; }
    button.choice.selected.correct { border-color:var(--good); background:var(--good-bg); color:var(--good); font-weight:800; }
    button.choice.selected.wrong { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); font-weight:800; }
    .feedback { margin-top:10px; min-height:24px; font-weight:800; }
    .feedback.good { color:var(--good); }
    .feedback.bad { color:var(--bad); }
    .feedback.wait { color:var(--muted); }
    .toolbar { display:flex; gap:8px; margin-top:10px; }
    .page-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
    button.ghost { color:var(--brand); font-weight:800; }
    .home-back {
      display:inline-flex; align-items:center; justify-content:center;
      min-height:36px; border:1px solid var(--line); border-radius:8px;
      padding:0 12px; margin:0 0 8px; background:#fff; color:var(--brand);
      font-weight:800; text-decoration:none;
    }
    .home-back:hover { border-color:var(--brand); background:#e8f1f9; }
    @media (max-width:760px) {
      .topbar { grid-template-columns:1fr; }
      main { padding:16px; }
      section { padding:16px; }
      .fields { grid-template-columns:1fr; }
    }
  </style>
</head>

        if (question.type === "single" && value === question.answer) done += 1;
        if (question.type === "fields" && isFieldCorrect(question, value)) done += 1;
        if (question.type === "stock" && isStockCorrect(question, value)) done += 1;
        if (question.type === "excel" && isExcelCorrect(question, value)) done += 1;
      }));
      document.getElementById("scoreDone").textContent = done;
      document.getElementById("scoreTotal").textContent = total;
    }

    function setFeedback(container, cls, text) {
      const feedback = container.querySelector(".feedback");
      feedback.className = `feedback ${cls}`;
      feedback.textContent = text;
    }

    function initQuestionState(question, gi, qi) {
      const key = keyFor(gi, qi);
      if (state.has(key)) return;
      if (question.type === "fields") state.set(key, new Array(question.fields.length).fill(""));
      if (question.type === "single") state.set(key, "");
      if (question.type === "multi") state.set(key, new Set());
      if (question.type === "stock") state.set(key, question.rows.map(() => ({ stock: "", enough: "", note: "" })));
      if (question.type === "excel") state.set(key, {
        rows: question.rows.map(row => ({ ...row })),
        statusFilter: "全部",
        priceSort: "",
        lastDeleted: null
      });
    }

    function isQuestionDone(question, gi, qi) {
      const value = state.get(keyFor(gi, qi));
      if (!value) return false;
      if (question.type === "multi") return normalizeSet(value) === normalizeSet(question.answers);
      if (question.type === "single") return value === question.answer;
      if (question.type === "fields") return isFieldCorrect(question, value);
      if (question.type === "stock") return isStockCorrect(question, value);
      if (question.type === "excel") return isExcelCorrect(question, value);
      return false;
    }

    function isStockCorrect(question, values) {
      return question.rows.every((row, index) => {
        const value = values[index] || {};
        return value.stock === row.stockAnswer && value.enough === row.enoughAnswer && value.note === row.noteAnswer;
      });
    }

    function visibleExcelRows(value) {
      return value.rows.filter(row => value.statusFilter === "全部" || row.status === value.statusFilter);
    }

    function duplicateOrderIds(rows) {
      const counts = rows.reduce((map, row) => {
        map[row.orderId] = (map[row.orderId] || 0) + 1;
        return map;
      }, {});
      return Object.keys(counts).filter(orderId => counts[orderId] > 1);
    }

    function isExcelCorrect(question, value) {
      const noDuplicates = duplicateOrderIds(value.rows).length === 0;
      const visibleOrder = visibleExcelRows(value).map(row => row.orderId).join("||");
      return noDuplicates
        && value.statusFilter === "已完成"
        && value.priceSort === "asc"
        && visibleOrder === question.expectedVisibleOrder.join("||");
    }

    function materialFor(group, question) {
      const titleRule = `<h4>平台商品标题撰写规则</h4><ul><li>长度限制：80-120个字符（含空格）。</li><li>结构要求：品牌 + 核心关键词 + 关键属性 + 适用场景/人群。</li><li>大小写：每个单词首字母大写，介词、连词、冠词除外。</li><li>数字：必须使用阿拉伯数字。</li><li>禁止事项：促销用语、主观评价词、特殊符号、关键词堆砌、全大写。</li></ul>`;
      if (group.id === "ab002" && question.title === "规则识别与判断") return titleRule + `<h4>规则识别与判断标题</h4>` + question.context;
      if (group.id === "ab002" && question.title === "正确标题选择") return titleRule + `<h4>正确标题选择选项</h4>` + question.context;
      if (group.id === "ab002" && question.context) return titleRule + question.context;
      if (question.context && /<table|<h4|选项库|说法|库存信息|标题/.test(question.context)) return question.context;
      return group.source;
    }

    function examLabel(group) {
      return group.taskCode;
    }

    function renderFields(question, gi, qi, container) {
      initQuestionState(question, gi, qi);
      const values = state.get(keyFor(gi, qi));
      const fields = document.createElement("div");
      fields.className = "fields";
      question.fields.forEach((field, index) => {
        const wrap = document.createElement("div");
        wrap.className = "field";
        const label = document.createElement("label");
        label.textContent = field.label;
        wrap.appendChild(label);
        if (field.note) {
          const note = document.createElement("div");
          note.className = "field-note";
          note.textContent = field.note;
          wrap.appendChild(note);
        }
        const select = document.createElement("select");
        select.innerHTML = `<option value="">请选择</option>` + field.options.map(option => `<option value="${escapeAttr(option)}">${escapeHtml(option)}</option>`).join("");
        select.value = values[index] || "";
        if (select.value === field.answer) select.classList.add("correct");
        else if (select.value) select.classList.add("wrong");
        select.addEventListener("change", () => {
          values[index] = select.value;
          select.classList.remove("correct", "wrong");
          if (!select.value) setFeedback(container, "wait", "继续选择。");
          else if (select.value === field.answer) {
            select.classList.add("correct");
            setFeedback(container, isFieldCorrect(question, values) ? "good" : "wait", isFieldCorrect(question, values) ? "本题全部正确。" : "这个选项正确，继续完成本题。");
          } else {
            select.classList.add("wrong");
            const detail = field.explanation ? `${field.explanation} 正确答案：${field.answer}` : `这个选项不对。正确答案：${field.answer}`;
            setFeedback(container, "bad", detail);
          }
          updateScore();
        });
        wrap.appendChild(select);
        fields.appendChild(wrap);
      });
      container.appendChild(fields);
    }

    function renderSingle(question, gi, qi, container) {
      initQuestionState(question, gi, qi);
      const selectedValue = state.get(keyFor(gi, qi));
      const chips = document.createElement("div");
      chips.className = "chips";
      question.options.forEach(option => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice";
        btn.textContent = option;
        if (selectedValue === option) btn.classList.add("selected", option === question.answer ? "correct" : "wrong");
        btn.addEventListener("click", () => {
          chips.querySelectorAll("button").forEach(b => b.className = "choice");
          state.set(keyFor(gi, qi), option);
          btn.classList.add("selected", option === question.answer ? "correct" : "wrong");
          const wrongText = question.explanations && question.explanations[option] ? question.explanations[option] : `回答错误。正确答案：${question.answer}`;
          setFeedback(container, option === question.answer ? "good" : "bad", option === question.answer ? "回答正确。" : wrongText);
          updateScore();
        });
        chips.appendChild(btn);
      });
      container.appendChild(chips);
    }

    function renderStock(question, gi, qi, container) {
      initQuestionState(question, gi, qi);
      const values = state.get(keyFor(gi, qi));
      const table = document.createElement("table");
      table.className = "stock-table";
      table.innerHTML = `<thead><tr><th>订单号</th><th>商品名称</th><th>SKU</th><th>订单数量</th><th>库存数量</th><th>是否充足</th><th>备注</th></tr></thead>`;
      const tbody = document.createElement("tbody");
      question.rows.forEach((row, index) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${escapeHtml(row.orderId)}</td><td>${escapeHtml(row.product)}</td><td>${escapeHtml(row.sku)}</td><td>${escapeHtml(row.qty)}</td>`;

        const stockCell = document.createElement("td");
        const stockSelect = makeSelect(row.stockOptions, values[index].stock);
        const enoughCell = document.createElement("td");
        const enoughSelect = makeSelect(["是", "否"], values[index].enough);
        const noteCell = document.createElement("td");
        const noteSelect = makeSelect(row.noteOptions, values[index].note);

        const mark = () => {
          values[index].stock = stockSelect.value;
          values[index].enough = enoughSelect.value;
          values[index].note = noteSelect.value;
          updateStockSelect(stockSelect, row.stockAnswer);
          updateStockSelect(enoughSelect, row.enoughAnswer);
          updateStockSelect(noteSelect, row.noteAnswer);
          if (isStockCorrect(question, values)) setFeedback(container, "good", "本题全部正确。");
          else setFeedback(container, "wait", "继续核对库存数量、是否充足和备注。");
          updateScore();
        };
        [stockSelect, enoughSelect, noteSelect].forEach(select => select.addEventListener("change", mark));
        stockCell.appendChild(stockSelect);
        enoughCell.appendChild(enoughSelect);
        noteCell.appendChild(noteSelect);
        tr.append(stockCell, enoughCell, noteCell);
        tbody.appendChild(tr);
        updateStockSelect(stockSelect, row.stockAnswer);
        updateStockSelect(enoughSelect, row.enoughAnswer);
        updateStockSelect(noteSelect, row.noteAnswer);
      });
      table.appendChild(tbody);
      container.appendChild(table);
    }

    function renderExcel(question, gi, qi, container) {
      initQuestionState(question, gi, qi);
      const values = state.get(keyFor(gi, qi));

      const toolbar = document.createElement("div");
      toolbar.className = "excel-toolbar";

      const check = document.createElement("button");
      check.type = "button";
      check.className = "ghost excel-check";
      check.textContent = "检查答案";

      const reset = document.createElement("button");
      reset.type = "button";
      reset.className = "ghost";
      reset.textContent = "重置表格";

      const undo = document.createElement("button");
      undo.type = "button";
      undo.className = "ghost";
      undo.textContent = "撤销删除";
      undo.disabled = !values.lastDeleted;

      const status = document.createElement("span");
      status.className = "excel-status";
      toolbar.append(check, reset, undo, status);
      container.appendChild(toolbar);

      const wrap = document.createElement("div");
      wrap.className = "excel-wrap";
      const table = document.createElement("table");
      table.className = "excel-table";
      wrap.appendChild(table);
      container.appendChild(wrap);

      const renderSheet = () => {
        status.textContent = `当前保留 ${values.rows.length} 行，显示 ${visibleExcelRows(values).length} 行`;
        undo.disabled = !values.lastDeleted;
        table.innerHTML = "";
        const thead = document.createElement("thead");
        thead.innerHTML = `
          <tr>
            <th class="row-head">行</th>
            <th>订单号</th>
            <th>下单时间</th>
            <th>商品</th>
            <th><div class="header-control"><span>单价</span><button type="button" class="sort-btn ${values.priceSort === "asc" ? "active" : ""}" title="按单价升序排序">↑</button></div></th>
            <th>数量</th>
            <th>订单金额</th>
            <th>支付金额</th>
            <th><div class="header-control"><span>状态</span><select aria-label="状态筛选"><option value="全部">全部</option><option value="已完成">已完成</option><option value="已发货">已发货</option><option value="待发货">待发货</option><option value="已取消">已取消</option><option value="退款中">退款中</option></select></div></th>
            <th>买家ID</th>
            <th>操作</th>
          </tr>
        `;
        table.appendChild(thead);
        const filter = thead.querySelector("select");
        filter.value = values.statusFilter;
        filter.addEventListener("change", () => {
          values.statusFilter = filter.value;
          renderSheet();
          setFeedback(container, "wait", values.statusFilter === "已完成" ? "已筛选“已完成”订单，继续按单价升序排序。" : "本题要求筛选“已完成”状态订单。");
          updateScore();
        });
        const sortBtn = thead.querySelector(".sort-btn");
        sortBtn.addEventListener("click", () => {
          values.rows.sort((a, b) => a.price - b.price || question.rows.findIndex(row => row.uid === a.uid) - question.rows.findIndex(row => row.uid === b.uid));
          values.priceSort = "asc";
          renderSheet();
          setFeedback(container, "wait", "已按单价升序排序，请检查是否已删除重复行并筛选“已完成”。");
          updateScore();
        });

        const tbody = document.createElement("tbody");
        const rows = visibleExcelRows(values);
        rows.forEach((row) => {
          const originalIndex = question.rows.findIndex(item => item.uid === row.uid) + 1;
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td class="row-head">${originalIndex}</td>
            <td>${escapeHtml(row.orderId)}</td>
            <td>${escapeHtml(row.date)}</td>
            <td>${escapeHtml(row.product)}</td>
            <td>${row.price.toFixed(2)}</td>
            <td>${row.qty}</td>
            <td>${row.orderAmount.toFixed(2)}</td>
            <td>${row.paymentAmount.toFixed(2)}</td>
            <td>${escapeHtml(row.status)}</td>
            <td>${escapeHtml(row.buyerId)}</td>
            <td><button type="button" class="delete-row" title="删除这一行">×</button></td>
          `;
          tr.querySelector(".delete-row").addEventListener("click", () => {
            const sameOrderCount = values.rows.filter(item => item.orderId === row.orderId).length;
            values.rows = values.rows.filter(item => item.uid !== row.uid);
            values.lastDeleted = row;
            values.priceSort = "";
            renderSheet();
            if (sameOrderCount > 1) setFeedback(container, "wait", `已删除 ${row.orderId} 的一条记录。同一订单号保留一条即可。`);
            else setFeedback(container, "bad", `${row.orderId} 只有一条记录，不应删除。可以点击“撤销删除”或“重置表格”。`);
            updateScore();
          });
          tbody.appendChild(tr);
        });
        if (!rows.length) {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td colspan="11" class="row-head">当前筛选无结果</td>`;
          tbody.appendChild(tr);
        }
        table.appendChild(tbody);
      };

      const explain = () => {
        const duplicates = duplicateOrderIds(values.rows);
        if (duplicates.length) return `还有重复订单号未删除：${duplicates.join("、")}。请先把状态筛选切回“全部”，删除重复订单号的多余行，同一订单号只保留一条。`;
        if (values.rows.length < new Set(question.rows.map(row => row.orderId)).size) return "有唯一订单被误删了。请撤销删除或重置表格后，只删除重复订单号的多余行。";
        if (values.statusFilter !== "已完成") return "请在“状态”列下拉筛选中选择“已完成”。";
        if (values.priceSort !== "asc") return "已筛选后，还需要点击“单价”表头的 ↑，按单价从低到高排序。";
        const visibleOrder = visibleExcelRows(values).map(row => row.orderId).join("、");
        return `当前可见订单顺序是 ${visibleOrder || "空"}，还没有得到正确的升序结果。`;
      };

      check.addEventListener("click", () => {
        const correct = isExcelCorrect(question, values);
        setFeedback(container, correct ? "good" : "bad", correct ? "完成正确。你已完成删除重复订单、筛选已完成订单，并按单价升序排序。" : explain());
        updateScore();
      });

      reset.addEventListener("click", () => {
        values.rows = question.rows.map(row => ({ ...row }));
        values.statusFilter = "全部";
        values.priceSort = "";
        values.lastDeleted = null;
        renderSheet();
        setFeedback(container, "wait", "表格已重置，请重新完成去重、筛选和排序。");
        updateScore();
      });

      undo.addEventListener("click", () => {
        if (!values.lastDeleted) return;
        const restored = values.lastDeleted;
        values.rows.push(restored);
        values.rows.sort((a, b) => question.rows.findIndex(row => row.uid === a.uid) - question.rows.findIndex(row => row.uid === b.uid));
        values.lastDeleted = null;
        values.priceSort = "";
        renderSheet();
        setFeedback(container, "wait", `已恢复 ${restored.orderId}。`);
        updateScore();
      });

      renderSheet();
    }

    function makeSelect(options, value) {
      const select = document.createElement("select");
      select.innerHTML = `<option value="">请选择</option>` + options.map(option => `<option value="${escapeAttr(option)}">${escapeHtml(option)}</option>`).join("");
      select.value = value || "";
      return select;
    }

    function updateStockSelect(select, answer) {
      select.classList.remove("correct", "wrong");
      if (!select.value) return;
      select.classList.add(select.value === answer ? "correct" : "wrong");
    }

    function renderMulti(question, gi, qi, container) {
      initQuestionState(question, gi, qi);
      const selected = state.get(keyFor(gi, qi));
      const answers = new Set(question.answers);
      const chips = document.createElement("div");
      chips.className = "chips";
      question.options.forEach(option => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice";
        btn.textContent = option;
        if (selected.has(option)) btn.classList.add("selected", answers.has(option) ? "correct" : "wrong");
        btn.addEventListener("click", () => {
          if (selected.has(option)) selected.delete(option); else selected.add(option);
          btn.classList.toggle("selected", selected.has(option));
          btn.classList.remove("correct", "wrong");
          if (selected.has(option)) btn.classList.add(answers.has(option) ? "correct" : "wrong");
          const hasWrong = [...selected].some(item => !answers.has(item));
          const exact = normalizeSet(selected) === normalizeSet(question.answers);
          if (exact) setFeedback(container, "good", "全部选择正确。");
          else if (hasWrong) {
            const wrongItem = [...selected].find(item => !answers.has(item));
            const reason = question.explanations && question.explanations[wrongItem] ? question.explanations[wrongItem] : "这个选项不符合题目要求。";
            setFeedback(container, "bad", `${wrongItem} 不应选择。${reason}`);
          }
          else setFeedback(container, "wait", `已选 ${selected.size} 项，还差 ${Math.max(question.answers.length - selected.size, 0)} 项。`);
          updateScore();
        });
        chips.appendChild(btn);
      });
      container.appendChild(chips);
      const toolbar = document.createElement("div");
      toolbar.className = "toolbar";
      const reveal = document.createElement("button");
      reveal.type = "button";
      reveal.className = "ghost";
      reveal.textContent = "显示答案";
      reveal.addEventListener("click", () => setFeedback(container, "wait", `正确答案：${question.answers.join("、")}`));
      toolbar.appendChild(reveal);
      container.appendChild(toolbar);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[char]));
    }
    function escapeAttr(value) { return escapeHtml(value); }

    function render() {
      nav.innerHTML = "";
      app.innerHTML = "";
      pages.forEach((page, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = `${index + 1}`;
        button.title = `${examLabel(page.group)} - ${page.group.focus} - ${page.question.title}`;
        if (index === currentPage) button.classList.add("active");
        if (isQuestionDone(page.question, page.gi, page.qi)) button.classList.add("done");
        button.addEventListener("click", () => { currentPage = index; render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
        nav.appendChild(button);
      });

      const { group, question, gi, qi } = pages[currentPage];
      initQuestionState(question, gi, qi);
      const section = document.createElement("section");
      section.id = group.id;
      section.innerHTML = `
        <div class="pager">
          <button type="button" id="prevPage" ${currentPage === 0 ? "disabled" : ""}>上一题</button>
          <span>第 ${currentPage + 1} / ${pages.length} 题</span>
          <button type="button" id="nextPage" ${currentPage === pages.length - 1 ? "disabled" : ""}>下一题</button>
        </div>
        <h2>${escapeHtml(group.title)}</h2>
        <div class="exam-meta">
          <span>${escapeHtml(examLabel(group))}</span>
          <span class="focus">核心考点：${escapeHtml(group.focus)}</span>
        </div>
        <div class="material"><div class="material-title">当前题资料</div>${materialFor(group, question)}</div>
      `;
      const q = document.createElement("div");
      q.className = "question";
      q.innerHTML = `
        <h3>${escapeHtml(question.title)}</h3>
        <p class="stem">${escapeHtml(question.stem)}</p>
      `;
      if (question.type === "fields") renderFields(question, gi, qi, q);
      if (question.type === "single") renderSingle(question, gi, qi, q);
      if (question.type === "multi") renderMulti(question, gi, qi, q);
      if (question.type === "stock") renderStock(question, gi, qi, q);
      if (question.type === "excel") renderExcel(question, gi, qi, q);
      const feedback = document.createElement("div");
      feedback.className = "feedback wait";
      feedback.textContent = isQuestionDone(question, gi, qi) ? "本题已完成。" : "等待作答。";
      q.appendChild(feedback);
      const actions = document.createElement("div");
      actions.className = "page-actions";
      const next = document.createElement("button");
      next.type = "button";
      next.className = "ghost";
      next.textContent = currentPage === pages.length - 1 ? "完成" : "下一题";
      next.addEventListener("click", () => {
        if (currentPage === pages.length - 1 && question.type === "excel") {
          const checkButton = q.querySelector(".excel-check");
          if (checkButton) checkButton.click();
          return;
        }
        if (currentPage < pages.length - 1) currentPage += 1;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      actions.appendChild(next);
      q.appendChild(actions);
      section.appendChild(q);
      app.appendChild(section);
      document.getElementById("prevPage").addEventListener("click", () => { if (currentPage > 0) currentPage -= 1; render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
      document.getElementById("nextPage").addEventListener("click", () => { if (currentPage < pages.length - 1) currentPage += 1; render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
      updateScore();
    }

    render();
  </script>
</body>
</html>
